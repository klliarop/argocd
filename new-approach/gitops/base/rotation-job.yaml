# Job that runs oc set data to update the global pull secret.
# The actual pull secret data comes from the pull-secret-data ConfigMap
# in the same namespace — generated by rotate-job.sh and pushed to Git.
#
# ArgoCD syncs this Job every time the ConfigMap changes.
# The Job name includes a timestamp placeholder replaced by rotate-job.sh
# so ArgoCD treats each rotation as a new Job (Jobs are immutable once run).
apiVersion: batch/v1
kind: Job
metadata:
  name: pull-secret-rotation-TIMESTAMP
  namespace: openshift-config
  labels:
    app.kubernetes.io/component: pull-secret-rotation
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300   # auto-clean up 5 minutes after completion
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: pull-secret-rotator
      restartPolicy: OnFailure
      containers:
        - name: rotator
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "==> Starting pull secret rotation..."

              # Write the secret data from the ConfigMap volume to a temp file
              cp /data/.dockerconfigjson /tmp/pull-secret.json

              # Verify it's valid JSON
              python3 -c "import json,sys; json.load(open('/tmp/pull-secret.json'))" \
                || { echo "ERROR: pull-secret.json is not valid JSON"; exit 1; }

              echo "==> Applying new pull secret..."
              oc set data secret/pull-secret \
                -n openshift-config \
                --from-file=.dockerconfigjson=/tmp/pull-secret.json

              echo "==> Verifying update..."
              oc get secret pull-secret -n openshift-config \
                --template='{{index .data ".dockerconfigjson" | base64decode}}' \
                | python3 -c "import json,sys; d=json.load(sys.stdin); print('Registries:', list(d['auths'].keys()))"

              echo "==> Pull secret rotation complete."
          volumeMounts:
            - name: pull-secret-data
              mountPath: /data
              readOnly: true
      volumes:
        - name: pull-secret-data
          configMap:
            name: pull-secret-data
