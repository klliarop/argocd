apiVersion: batch/v1
kind: Job
metadata:
  name: pull-secret-rotation-TIMESTAMP
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: pull-secret-rotator
      restartPolicy: OnFailure
      containers:
        - name: rotator
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "==> Applying new pull secret..."
              oc set data secret/pull-secret \
                -n openshift-config \
                --from-file=.dockerconfigjson=/data/.dockerconfigjson
              echo "==> Verifying..."
              oc get secret pull-secret -n openshift-config \
                --template='{{index .data ".dockerconfigjson" | base64decode}}' \
                | python3 -c "import json,sys; d=json.load(sys.stdin); print('Registries:', list(d['auths'].keys()))"
              echo "==> Done."
          volumeMounts:
            - name: pull-secret-data
              mountPath: /data
              readOnly: true
      volumes:
        - name: pull-secret-data
          configMap:
            name: pull-secret-data
