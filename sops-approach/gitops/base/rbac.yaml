# ServiceAccount used by the rotation Job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pull-secret-rotator
  namespace: openshift-config
---
# Minimal RBAC — only permission needed is to patch the pull-secret
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pull-secret-rotator
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["pull-secret"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pull-secret-rotator
subjects:
  - kind: ServiceAccount
    name: pull-secret-rotator
    namespace: openshift-config
roleRef:
  kind: ClusterRole
  name: pull-secret-rotator
  apiGroup: rbac.authorization.k8s.io
