apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The base declares what resources are managed.
# The actual SealedSecret content is provided per-overlay.
resources: []

# Common labels applied to all resources in every overlay
commonLabels:
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/component: pull-secret-rotation
