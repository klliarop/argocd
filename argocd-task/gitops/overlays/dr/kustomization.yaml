apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base/pull-secret

# sealed-secret.yaml is generated by: ./scripts/seal-pull-secret.sh dr
# It is safe to commit — it is encrypted with the DR cluster's public key.
resources:
  - sealed-secret.yaml

commonLabels:
  environment: dr
